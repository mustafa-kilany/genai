<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jordan Law Assistant Demo</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 20px;color:#172033}textarea,input,button{font:inherit}textarea{width:100%;min-height:100px}button{padding:10px 16px;background:#1769aa;color:white;border:0;border-radius:6px}#answer{white-space:pre-wrap;background:#eef5fb;padding:16px;border-radius:8px}</style></head><body><h1>Jordan Law Assistant</h1><p>Synthetic, no-client-data demonstration of a retrieval-style legal assistant.</p><textarea id="q" placeholder="Ask about data privacy, penalties, or consumer purchases"></textarea><p><button onclick="ask()">Ask</button></p><pre id="answer"></pre><script>async function ask(){const q=document.querySelector('#q').value;const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});const d=await r.json();document.querySelector('#answer').textContent=d.answer+'\\n\\n'+d.disclaimer}</script></body></html>
